name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[server,mcp,dev]"

      - name: Run Python tests
        run: pytest

      - name: Build and run C tests
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist-check
          python -m pip wheel --no-deps dist-check/*.tar.gz --wheel-dir dist-check/wheels

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Run native sanitizer tests
        run: |
          cmake --build build-sanitized --parallel
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-sanitized --output-on-failure

      - name: Build and run deterministic fault matrix
        run: |
          cmake -S . -B build-faults -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build build-faults --parallel --target wisedb_test_fault_injection
          ctest --test-dir build-faults --output-on-failure -R '^fault_injection$'

  extension-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extension with sanitizers
        run: |
          ASAN_RUNTIME="$(gcc -print-file-name=libasan.so)"
          export CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          export LDFLAGS="-fsanitize=address,undefined"
          export LD_PRELOAD="$ASAN_RUNTIME"
          python -m pip install -e ".[server,mcp,dev]"
          python -m pytest tests/test_memory_v3.py -q
