services:
  wise:
    build: .
    container_name: wisedb
    environment:
      WISEDB_API_KEY: ${WISEDB_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - wisedb_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  wisedb_data:
