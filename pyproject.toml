[build-system]
requires = ["setuptools>=68", "cython>=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisedb"
version = "3.0.0"
description = "Long-term LLM agent memory: WikiLLM on disk, C core, Python/C++ libraries."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agent-memory", "wikillm", "mcp", "fastapi", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
]
mcp = ["mcp[cli]>=1.2,<2"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
]

[project.scripts]
wisedb-server = "wisedb.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
