[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisedb"
version = "2.1.0"
description = "Контекстная БД: быстрый поиск в ОЗУ + опционально SQLite + демо 2D-визуализации."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["context-db", "retrieval", "vector-search", "mcp", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
mcp = ["mcp[cli]>=1.2", "httpx>=0.27"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "hnswlib>=0.8.0",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
]
embed = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
wisedb-viz = "wisedb.visualize:main"
wisedb-server = "wisedb.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
